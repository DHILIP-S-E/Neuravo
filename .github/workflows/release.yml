name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install build tooling
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Run tests
      run: |
        pip install -e ".[dev,openai]"
        pytest tests/unit tests/integration

    - name: Build sdist and wheel
      run: python -m build

    - name: Verify package metadata with twine
      run: twine check dist/*

    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: dist
        path: dist/

    # Publishing to PyPI is intentionally a separate, manual step (see
    # README.md) - this workflow only proves the package builds and passes
    # metadata validation on every tag push. Wire up a `pypi` job here with
    # PyPI Trusted Publishing (no stored API token needed) once you're
    # ready to automate the actual upload.
