name: Publish to PyPI

# Fires when a GitHub Release is published (not on every tag push) - you
# review and create the release deliberately, which is the actual trigger
# for a real publish. Uses PyPI Trusted Publishing (OIDC): no stored API
# token, scoped to the `pypi` environment below.

on:
  release:
    types: [published]

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/neuravo
    permissions:
      id-token: write  # required for OIDC trusted publishing

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install build tooling
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build sdist and wheel
      run: python -m build

    - name: Verify package metadata with twine
      run: twine check dist/*

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
