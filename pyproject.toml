[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuravo"
version = "0.1.0"
description = "Production-grade Python AI Infrastructure SDK with provider-agnostic interface"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Neuravo Team", email = "team@neuravo.ai"}
]
keywords = [
    "ai",
    "machine-learning",
    "bedrock",
    "llm",
    "sdk",
    "provider-agnostic",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "boto3>=1.34.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
]

[project.optional-dependencies]
openai = [
    "openai>=1.0",
]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.1",
    "hypothesis>=6.80",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.6",
    "types-requests",
    "sphinx>=7.0",
    "sphinx-rtd-theme>=1.3",
]

[project.urls]
Homepage = "https://github.com/neuravo/neuravo-sdk"
Documentation = "https://neuravo.readthedocs.io"
Repository = "https://github.com/neuravo/neuravo-sdk"
Issues = "https://github.com/neuravo/neuravo-sdk/issues"

[tool.setuptools]
packages = ["neuravo"]

[tool.setuptools.package-data]
neuravo = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "--strict-markers -v"
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "property: property-based tests",
    "slow: slow tests",
]

[tool.coverage.run]
source = ["src/neuravo"]
branch = true
parallel = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "pass",
]
precision = 2
show_missing = true
skip_covered = false

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
no_implicit_optional = true
exclude = ["tests/", "setup.py"]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

# Ruff config lives in the standalone ruff.toml at the repo root - a
# standalone ruff.toml always takes precedence over [tool.ruff] here, so a
# duplicate (and disagreeing) section in this file was silently dead config.

[tool.isort]
profile = "black"
line_length = 88
multi_line_mode = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = ["*/migrations/*", "*/tests/*"]
