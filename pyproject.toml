[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuravo"
version = "0.1.0"
description = "Production-grade Python AI Infrastructure SDK with provider-agnostic interface"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Neuravo Team", email = "team@neuravo.ai"}
]
keywords = [
    "ai",
    "machine-learning",
    "bedrock",
    "llm",
    "sdk",
    "provider-agnostic",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "boto3>=1.34.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
]

[project.optional-dependencies]
openai = [
    "openai>=1.0",
]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.1",
    "hypothesis>=6.80",
    "ruff>=0.4",
    "mypy>=1.6",
    "types-requests",
    "sphinx>=7.0",
    "sphinx-rtd-theme>=1.3",
]

[project.urls]
Homepage = "https://github.com/DHILIP-S-E/Neuravo"
Documentation = "https://github.com/DHILIP-S-E/Neuravo/tree/main/docs"
Repository = "https://github.com/DHILIP-S-E/Neuravo"
Issues = "https://github.com/DHILIP-S-E/Neuravo/issues"

[tool.setuptools]
packages = ["neuravo"]

[tool.setuptools.package-data]
neuravo = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "--strict-markers -v"
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "property: property-based tests",
    "slow: slow tests",
]

[tool.coverage.run]
source = ["src/neuravo"]
branch = true
parallel = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "pass",
]
precision = 2
show_missing = true
skip_covered = false

# mypy config lives in the standalone mypy.ini at the repo root - mypy's
# config-file discovery uses the FIRST file it finds (mypy.ini takes
# priority over [tool.mypy] here), so a duplicate section in this file was
# silently dead config the whole time. Same reasoning as the ruff note above.

# Formatting and import sorting are handled by `ruff format` / ruff's `I`
# rules (see ruff.toml) - not black/isort, which were never actually wired
# up consistently (mismatched line-length, and isort's config here used an
# unsupported option that crashed `isort --check-only` outright).
