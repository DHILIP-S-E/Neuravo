[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts = --strict-markers -v --tb=short

markers =
    unit: Unit tests (fast, no I/O)
    integration: Integration tests (mocked I/O)
    property: Property-based tests (hypothesis)
    slow: Slow tests (benchmarks, stress tests)
    asyncio: Async tests (requires asyncio)
